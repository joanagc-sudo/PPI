
<!--PEQUISAR SELETORES

position{
    Satic - posição padrão
    relative - relativo ao static
    {
    top
    left
    right
    bottom
    }
    fixed
    absolut
}
    Absolute - é uma propriedade do CSS que remove um elemento do fluxo normal da página e o posiciona em relação ao seu ancestral posicionado mais próximo 

    Fixed - 
display: inline
display block
display: inline - block
display: relative
-->


<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        *{border: 1px solid black;}
        div{
            display : inline-block;
            height : 50px;
            width : 50px;
        }
        p{
            display:none;
        }
        span{
            display : block;
            width: 50px;
        }
        .box{display: inline-block;}
        #container{
            width: 100%;
            height: 400px;
            position: relative;
        }
        #box1{
            background-color: greenyellow;
            position: relative;
            top: 50px;
            left: 100px;
        }
        #box2{
            background-color: rgba(100, 0, 0, 1);
            position: fixed;
            z-index:1;
        }
        #box4{
            position: absolute;
            top: 0px;
            left: 0px;
        }
    </style>
</head>
<body>
    <div>Lorem div</div>
    <div>Lorem div</div>
    <p>Lorem p</p>
    <p>Lorem p</p>
    <span>Lorem span</span>
    <span>Lorem span</span>
    <hr>
    <h2>Positions</h2>
    <div id="container">
        <div class="box" id="box1">box1</div>
        <div class="box" id="box2">box2</div>
        <div class="box" id="box3">box3</div>
        <div class="box" id="box4">box4</div>
        <div class="box" id="box5">box5</div>
    </div>
</body>
</html>
